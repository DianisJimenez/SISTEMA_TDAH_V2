<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DETEC TDAH - Mis Dispositivos</title>

  <link rel="stylesheet" href="assets/fonts/remix/remixicon.css">
  <link rel="stylesheet" href="assets/css/main.min.css">
  <link rel="stylesheet" href="assets/vendor/overlay-scroll/OverlayScrollbars.min.css">

  <link rel="stylesheet" href="assets/css/components/theme-variables.css">
  <link rel="stylesheet" href="assets/css/components/sidebar-menu.css">
  <link rel="stylesheet" href="assets/css/pages/misDispositivos.css">
</head>

<body>

  <div id="loading-wrapper">
    <div class="spin-wrapper">
      <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
      <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
    </div>
  </div>

  <div class="page-wrapper">
    <div class="main-container">

      <nav id="sidebar" class="sidebar-wrapper"></nav>

      <div class="app-container">

        <header class="app-header d-flex align-items-center justify-content-between px-4 border-bottom"></header>

        <div class="bg-white border-bottom d-flex align-items-center justify-content-between px-4 py-2">
          <div class="d-flex align-items-center gap-2 text-secondary fw-medium small">
            <i class="ri-home-4-line"></i> <span class="text-secondary opacity-50">/</span> <span class="text-dark">Administración de Equipos</span>
          </div>
          <div class="d-flex gap-3 align-items-center">
            <div class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-3 py-2" id="contador-dispositivos">
                Dispositivos: 0 / 10
            </div>
            <button id="btnNuevoDispositivo" class="btn btn-primary rounded-pill px-4 shadow-sm btn-sm" data-bs-toggle="modal" data-bs-target="#modalRegistro">
                <i class="ri-add-line me-1"></i> Nuevo
            </button>
          </div>
        </div>

        <div class="app-body">
          <div class="row gx-3" id="contenedorDispositivos"></div>
        </div> 

      </div> 
    </div> 
  </div> 

  <!-- MODAL: REGISTRAR NUEVO DISPOSITIVO -->
  <div class="modal fade" id="modalRegistro" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold">Registrar Equipo</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="formNuevoDispositivo">
            <div class="mb-3">
              <label class="form-label small fw-bold">Nombre</label>
              <input type="text" id="nombreDisp" class="form-control shadow-none" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Conexión</label>
              <select id="conexionDisp" class="form-select shadow-none">
                <option value="Bluetooth LE">Bluetooth LE</option>
                <option value="USB 3.0 / USB-C">USB 3.0 / USB-C</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Descripción</label>
              <textarea id="descDisp" class="form-control shadow-none" rows="2"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Imagen</label>
                <input type="file" id="fotoDisp" class="form-control shadow-none" accept="image/*">
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2 mt-2">GUARDAR</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: EDITAR DISPOSITIVO -->
  <div class="modal fade" id="modalEditarDispositivo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold">Editar Equipo</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="formEditarDispositivo">
            <input type="hidden" id="editIdDisp">
            <div class="mb-3">
              <label class="form-label small fw-bold">Nombre</label>
              <input type="text" id="editNombreDisp" class="form-control shadow-none" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Conexión</label>
              <select id="editConexionDisp" class="form-select shadow-none">
                <option value="Bluetooth LE">Bluetooth LE</option>
                <option value="USB 3.0 / USB-C">USB 3.0 / USB-C</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Descripción</label>
              <textarea id="editDescDisp" class="form-control shadow-none" rows="2"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Actualizar Imagen</label>
              <input type="file" id="editFotoDisp" class="form-control shadow-none" accept="image/*">
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2 mt-2">GUARDAR CAMBIOS</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/jquery.min.js"></script>
  <script src="assets/js/bootstrap.bundle.min.js"></script>

  <script src="js/shared/layout.js"></script>

  <script src="js/shared/temas.js"></script>
  <script src="js/pages/misDispositivos.js"></script>
</body>
</html>
