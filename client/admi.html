<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DETEC TDAH - Administración</title>

  <link rel="stylesheet" href="assets/fonts/remix/remixicon.css">
  <link rel="stylesheet" href="assets/css/main.min.css">
  <link rel="stylesheet" href="assets/vendor/overlay-scroll/OverlayScrollbars.min.css">

  <link rel="stylesheet" href="assets/css/components/theme-variables.css">
  <link rel="stylesheet" href="assets/css/components/sidebar-menu.css">
  <link rel="stylesheet" href="assets/css/pages/admi.css">
</head>

<body>

  <div id="loading-wrapper">
    <div class="spin-wrapper">
      <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
      <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
    </div>
  </div>

  <div class="page-wrapper">
    <div class="main-container">

      <!-- Contenedor del Menú Lateral (Se llena mediante layout.js) -->
      <nav id="sidebar" class="sidebar-wrapper"></nav>

      <div class="app-container">

        <!-- Contenedor de la Barra Superior (Se llena mediante layout.js) -->
        <div class="app-header d-flex align-items-center justify-content-between px-4 border-bottom"></div>

        <!-- Barra de Navegación Secundaria (Migas de pan y Fecha del sistema) -->
        <div class="bg-white border-bottom d-flex align-items-center justify-content-between px-4 py-2">
          <div class="d-flex align-items-center gap-2 text-secondary fw-medium small">
            <i class="ri-home-4-line"></i> <span class="text-secondary opacity-50">/</span> <span class="text-dark">Administración</span>
          </div>
          <div class="d-flex align-items-center border rounded overflow-hidden shadow-sm bg-white">
            <div class="bg-primary-subtle px-3 py-1 border-end border-light">
              <i class="ri-calendar-line text-primary"></i>
            </div>
            <!-- La fecha se inyectará automáticamente mediante inicializarLayout() -->
            <div id="currentDate" class="px-3 py-1 small fw-bold text-muted text-uppercase">--/--/----</div>
          </div>
        </div>

        <div class="app-body">

          <!-- Tarjetas de dispositivos cargadas dinámicamente -->
          <div class="row gx-3 mb-2" id="contenedorDispositivosInicio"></div>

          <!-- Sección de Gráficas Clínicas -->
          <div class="row gx-3 mb-3">
            <div class="col-xl-7">
              <div class="card shadow-sm border-0">
                <div class="card-body p-3">
                  <h6 class="mb-0 fw-bold text-primary small text-uppercase">Historial de Monitoreo</h6>
                  <span class="chart-subtitulo">Flujo de pacientes registrados por día</span>
                  <div class="chart-box-clinical mt-2"><canvas id="chartEvolucionDLC"></canvas></div>
                </div>
              </div>
            </div>
            <div class="col-xl-5">
              <div class="card shadow-sm border-0">
                <div class="card-body p-3">
                  <h6 class="mb-0 fw-bold text-primary small text-uppercase">Estado Global Pacientes</h6>
                  <span class="chart-subtitulo">Distribución por pronóstico</span>
                  <div class="chart-box-clinical chart-dona-wrap mt-2">
                    <canvas id="chartComparativaDLC"></canvas>
                    <div class="dona-centro">
                      <span class="dona-centro-num" id="donaCentroTotal">0</span>
                      <span class="dona-centro-label">pacientes</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Registro de pacientes recientes -->
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="fw-bold m-0">Registro de Pacientes <span class="text-primary">Recientes</span></h5>
            <a href="agregarPacientes.html" class="btn btn-primary rounded-pill px-4 shadow-sm">
              <i class="ri-user-add-line me-2"></i> Nuevo Registro
            </a>
          </div>

          <div class="card shadow-sm border-0 overflow-hidden">
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table m-0 align-middle">
                  <thead class="table-primary">
                    <tr>
                      <th class="ps-4" style="width: 100px;">Perfil</th>
                      <th>Paciente</th>
                      <th>Edad</th>
                      <th>Género</th>
                      <th class="pe-4">Estatus Sesión</th>
                    </tr>
                  </thead>
                  <tbody id="cuerpoTabla"></tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Scripts base -->
  <script src="assets/js/jquery.min.js"></script>
  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="/node_modules/chart.js/dist/chart.umd.js"></script>
  <script src="/node_modules/chartjs-plugin-annotation/dist/chartjs-plugin-annotation.min.js"></script>

  <!-- Lógica y Componentes -->
  <script src="js/shared/layout.js"></script>
  <script src="js/shared/temas.js"></script>
  <script src="js/pages/admi.js"></script>

</body>
</html>
