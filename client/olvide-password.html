<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DETEC TDAH - Recuperar Contraseña</title>

    <link rel="shortcut icon" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="assets/fonts/remix/remixicon.css">
    <link rel="stylesheet" href="assets/css/main.min.css">
    <link rel="stylesheet" href="assets/css/pages/login.css">
</head>

<body class="login-page-bg">

    <div class="page-wrapper">
        <div class="split-container">

            <div class="brand-panel">
                <div class="brand-content">
                    <img src="assets/images/logoTDHA.png" alt="DETEC TDAH" fetchpriority="high">
                    <h1>DETEC <span>TDAH</span></h1>
                    <div class="glow-line"></div>
                    <p>Plataforma de seguimiento y diagnóstico</p>
                </div>
            </div>

            <div class="form-panel">
                <form id="recuperarForm" class="login-form-box">

                    <div class="welcome-block">
                        <h2 class="welcome-title">Recupe<span>rar</span></h2>
                        <p>Escribe tu <span>correo registrado</span></p>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Correo Registrado</label>
                        <div class="input-group">
                            <i class="ri-mail-line field-icon"></i>
                            <input type="email" id="email" class="form-control has-icon" placeholder="correo@sistema.com" required>
                        </div>
                    </div>

                    <!-- El JS crea aquí dinámicamente el .error-banner y el mensaje de éxito -->

                    <div class="d-grid">
                        <button type="submit" class="btn-primary">
                            <span>Enviar enlace</span>
                            <i class="ri-mail-send-line"></i>
                        </button>
                    </div>
                    <p class="footer-text mb-0">
                        <a href="/index.html" style="color:inherit;">Volver a iniciar sesión</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
    <script type="module" src="/js/pages/olvidePassword.js"></script>
</body>

</html>
